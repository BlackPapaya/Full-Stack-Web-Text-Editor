<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>THE Papaya Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <h1>THE PAPAYA EDITOR</h1>
    <p>Create and edit your Textfile online without using a Cloud!</p>

    <!-- 1.Register Form -->
    <form id="registerForm">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        
        <button type="submit">Register</button>
    </form>
    <p id="message"></p>

    <hr>

    <!-- Mascot -->
    <img src="src/mimi.png" width="300" height="300" alt="Mimi">

    <!-- 2. Login Area -->
    <h2>Login</h2>
    <div id="loginSection">
        <label for="loginUsername">Username:</label>
        <input type="text" id="loginUsername" required>
        
        <label for="loginPassword">Password:</label>
        <input type="password" id="loginPassword" required>

        <button type="button" id="loginBtn">Login</button>
    </div>
    <p id="loginMessage"></p>

    <hr>

    <!-- 3. Texteditor-Area -->
    <div id="editorSection">
        <h2>Papaya Text Editor</h2>
        <textarea id="textEditor" rows="15" cols="80" placeholder="Schreib hier deinen Text..."></textarea>

        <br>

        <button id="saveLocalBtn">Lokal speichern (Browser)</button>
        <button id="downloadBtn">Als .txt herunterladen</button>
        <button id="saveToDbBtn">In Datenbank speichern (Backend)</button>

        <p id="editorMessage"></p>
    </div>

    <!-- external java script :) -->
    <script src="script.js" defer></script>
</body>
</html>
